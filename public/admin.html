<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unshaken admin</title>
<style>
:root{color-scheme:dark;--bg:#07110D;--card:#0F1D17;--card2:#14261E;--line:rgba(243,247,244,.13);--ink:#F3F7F4;--mute:#A9BDB2;--mint:#2BD38A;--gold:#F5B83D;--coral:#FF8A6B}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:24px;margin:0}
a{color:var(--mint)}
input,button,textarea,select{font:inherit;color:inherit}
input,textarea,select{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#132219;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--mint)}
button,.btn{min-height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
button:disabled{opacity:.55;cursor:wait}
.go{background:var(--mint);color:var(--bg);border:0}.no{background:var(--coral);color:var(--bg);border:0}.gold{border-color:var(--gold);color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.tabs,.sub{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button[aria-pressed=true],.sub button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sub button{min-height:36px;font-size:14px}
.n{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--card2);font-size:12px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.row.l{justify-content:flex-start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
label.inline{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.mute{color:var(--mute);font-size:13px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--mute)}
.pill.ok{color:var(--mint);border-color:var(--mint)}.pill.warn{color:var(--gold);border-color:var(--gold)}.pill.bad{color:var(--coral);border-color:var(--coral)}
.probs{color:var(--gold);font-size:13px}
.bar{position:sticky;top:0;z-index:2;background:rgba(7,17,13,.94);backdrop-filter:blur(6px);padding:8px 0;border-bottom:1px solid var(--line)}
.note{background:var(--card2);border-left:3px solid var(--mint);padding:10px 12px;border-radius:8px;font-size:14px}
.note.warn{border-color:var(--gold)}
pre.dg{white-space:pre-wrap;word-break:break-word;background:#0B1712;border:1px solid var(--line);border-radius:12px;padding:14px;font:14px/1.55 ui-monospace,Menlo,monospace;max-height:60vh;overflow:auto}
.v{font-weight:700}.v.red{color:var(--coral)}.v.orange{color:var(--gold)}.v.green{color:var(--mint)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}td.r{text-align:right}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="h1">Unshaken admin</h1>
    <div class="row l">
      <select id="lang" aria-label="Language" style="width:auto"></select>
      <button id="logout" hidden></button>
    </div>
  </div>
  <p id="beta" class="mute" hidden></p>
  <form id="login" class="row" hidden>
    <input id="pin" type="password" autocomplete="current-password" inputmode="text" style="flex:1">
    <button class="go" id="loginBtn"></button>
  </form>
  <p id="loginErr" class="probs" hidden></p>
  <nav class="tabs" id="tabs" hidden>
    <button data-v="queue" aria-pressed="true" data-t="tab_queue"></button>
    <button data-v="digest" data-t="tab_digest"></button>
    <button data-v="proofs" data-t="tab_proofs"></button>
    <button data-v="radar" data-t="tab_radar"></button>
    <button data-v="captains" data-t="tab_captains"></button>
  </nav>
  <div id="out"></div>
</div>
<script src="/i18n-ops.js"></script>
<script>
{
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const OPS = window.UNSHAKEN_OPS, LANGS = window.UNSHAKEN_OPS_LANGS;
let lang = localStorage.getItem("u_admin_lang") || "en";
if (!OPS[lang]) lang = "en";
const t = (k, v = {}) => String(OPS[lang]?.[k] ?? OPS.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const toast = m => { const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2600); };
const opened = new Set(JSON.parse(sessionStorage.getItem("u_opened") || "[]"));
const markOpened = id => { opened.add(id); sessionStorage.setItem("u_opened", JSON.stringify([...opened])); };
let view = "queue", status = "draft", items = [], counts = {}, digest = null;

async function call(q, body) {
  const r = await fetch("/api/admin" + q, { method: body ? "POST" : "GET", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || "401"); }
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const toLocalInput = iso => { if (!iso) return ""; const d = new Date(iso); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
const fmtDate = iso => iso ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + "T12:00:00" : iso).toLocaleDateString(lang === "en" ? "en-GB" : lang, { day: "numeric", month: "short", year: "numeric" }) : "";

function paintChrome() {
  document.documentElement.lang = lang;
  $("#h1").textContent = t("ad_title"); document.title = t("ad_title");
  $("#pin").placeholder = t("ad_pin"); $("#pin").setAttribute("aria-label", t("ad_pin"));
  $("#loginBtn").textContent = t("ad_open"); $("#logout").textContent = t("ad_logout");
  $("#beta").hidden = lang === "en"; $("#beta").textContent = t("beta");
  $$("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
}
function showLogin() { $("#login").hidden = false; $("#tabs").hidden = true; $("#logout").hidden = true; $("#out").innerHTML = ""; $("#pin").focus(); }
function showApp() { $("#login").hidden = true; $("#loginErr").hidden = true; $("#tabs").hidden = false; $("#logout").hidden = false; }

/* ---------- queue ---------- */
const CATS = ["Go", "Earn", "Learn", "Grow"];
function card(it) {
  const probs = it.problems || [], isDraft = it.status === "draft", isLive = it.status === "approved";
  const origin = { ai: t("o_ai"), rss: t("o_rss"), seed: t("o_seed"), manual: t("o_manual") }[it.origin] || it.origin;
  const steps = (it.steps || []).join("\n"), tags = (it.tags || []).join(", ");
  return `<article class="card" data-id="${esc(it.id)}">
  <div class="row">
    <label class="inline">${isDraft ? `<input type="checkbox" class="pick" aria-label="select">` : ""}<strong>${esc(it.title)}</strong></label>
    <span class="row l"><span class="pill">${esc(it.cat)}</span><span class="pill ${it.origin === "seed" ? "ok" : "warn"}">${esc(origin)}</span>${it.verified_on ? `<span class="pill ok">${esc(t("q_verified", { date: fmtDate(it.verified_on) }))}</span>` : ""}<span class="mute">${esc(t("q_created", { date: fmtDate(it.created_at) }))}</span></span>
  </div>
  <div class="row l">
    <a class="btn gold" data-a="open" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(t("q_open_link"))}</a>
    <span class="pill ${opened.has(it.id) ? "ok" : "warn"}" data-opened>${esc(opened.has(it.id) ? t("q_opened") : t("q_not_opened"))}</span>
    <button type="button" data-a="check">${esc(t("q_check"))}</button><span class="mute" data-check></span>
    ${it.source_url ? `<a class="mute" href="${esc(it.source_url)}" target="_blank" rel="noopener noreferrer">${esc(t("q_source"))}</a>` : ""}
  </div>
  ${it.flag ? `<div class="note warn">${esc(it.flag)}</div>` : ""}
  <div class="grid">
    <label>${esc(t("f_title"))}<input data-f="title" value="${esc(it.title)}"></label>
    <label>${esc(t("f_cat"))}<select data-f="cat">${CATS.map(c => `<option ${c === it.cat ? "selected" : ""}>${c}</option>`).join("")}</select></label>
  </div>
  <label>${esc(t("f_get"))}<textarea data-f="get">${esc(it.get)}</textarea></label>
  <label>${esc(t("f_who"))}<textarea data-f="who">${esc(it.who)}</textarea></label>
  <label>${esc(t("f_steps"))}<textarea data-f="steps" rows="4">${esc(steps)}</textarea></label>
  <div class="grid">
    <label>${esc(t("f_link"))}<input data-f="link" type="url" value="${esc(it.link)}"></label>
    <label>${esc(t("f_due"))}<input data-f="due" type="datetime-local" value="${esc(toLocalInput(it.due))}"></label>
    <label>${esc(t("f_due_text"))}<input data-f="due_text" value="${esc(it.due_text)}"></label>
    <div class="row l"><label class="inline"><input type="checkbox" data-f="rolling" ${it.rolling ? "checked" : ""}>${esc(t("f_rolling"))}</label><label class="inline"><input type="checkbox" data-f="opens" ${it.opens ? "checked" : ""}>${esc(t("f_opens"))}</label></div>
  </div>
  <details><summary>${esc(t("q_more"))}</summary>
    <div class="grid" style="margin-top:10px">
      <label>${esc(t("f_tags"))}<input data-f="tags" value="${esc(tags)}"></label>
      <label>${esc(t("f_verified"))}<input data-f="verified_on" type="date" value="${esc(it.verified_on || "")}"></label>
      <label>${esc(t("f_flag"))}<textarea data-f="flag">${esc(it.flag)}</textarea></label>
      <label>${esc(t("f_notes"))}<textarea data-f="notes">${esc(it.notes)}</textarea></label>
      <label>${esc(t("f_source"))}<input data-f="source_url" value="${esc(it.source_url)}"></label>
      <label>${esc(t("f_elig"))}<textarea data-f="elig" style="font-family:ui-monospace,monospace">${esc(JSON.stringify(it.elig || {}))}</textarea></label>
    </div>
  </details>
  <div class="probs" data-probs ${probs.length ? "" : "hidden"}>${esc(t("q_cant"))} ${probs.map(p => esc(t("pr_" + p))).join(" · ")}</div>
  <div class="row l">
    ${it.status !== "approved" ? `<button type="button" class="go" data-a="approve">${esc(t("q_approve"))}</button>` : ""}
    <button type="button" data-a="save">${esc(t("q_save"))}</button>
    ${isDraft ? `<button type="button" class="no" data-a="reject">${esc(t("q_reject"))}</button>` : ""}
    ${isLive ? `<button type="button" class="no" data-a="unpublish">${esc(t("q_unpublish"))}</button>` : ""}
    ${it.status === "rejected" || it.status === "expired" ? `<button type="button" data-a="unpublish">${esc(t("q_restore"))}</button>` : ""}
  </div>
</article>`;
}
function fieldsOf(el) {
  const f = {};
  el.querySelectorAll("[data-f]").forEach(i => {
    const k = i.dataset.f;
    if (i.type === "checkbox") f[k] = i.checked;
    else if (k === "due") f[k] = i.value ? new Date(i.value).toISOString() : null;
    else if (k === "steps") f[k] = i.value.split("\n").map(s => s.trim()).filter(Boolean);
    else if (k === "verified_on") f[k] = i.value || null;
    else f[k] = i.value;
  });
  return f;
}
async function loadQueue() {
  $("#out").innerHTML = `<p class="mute">…</p>`;
  const j = await call(`?view=queue&status=${status}`);
  items = j.items; counts = j.counts;
  const sub = ["draft", "approved", "rejected", "expired"].map(s => `<button data-s="${s}" aria-pressed="${s === status}">${esc(t("st_" + s))} <span class="n">${counts[s] || 0}</span></button>`).join("");
  $("#out").innerHTML = `<div class="bar"><div class="sub" id="sub">${sub}</div>
    <div class="row l">${status === "draft" ? `<label class="inline"><input type="checkbox" id="all">${esc(t("q_select_all"))}</label><button class="go" id="bulk" disabled>${esc(t("q_bulk", { n: 0 }))}</button>` : ""}
    <button id="expire">${esc(t("q_expire"))}</button><button id="fetch">${esc(t("q_fetch"))}</button></div></div>
    ${status === "draft" ? `<p class="note">${esc(t("q_routine"))}</p>` : ""}
    ${j.expired ? `<p class="mute">${esc(t("q_expired_n", { n: j.expired }))}</p>` : ""}
    <div id="report" class="mute"></div>
    ${items.length ? items.map(card).join("") : `<p class="mute">${esc(t("q_empty"))}</p>`}`;
}
function updateBulk() { const n = $$(".pick:checked").length, b = $("#bulk"); if (b) { b.disabled = !n; b.textContent = t("q_bulk", { n }); } }

/* ---------- digest ---------- */
async function loadDigest() {
  $("#out").innerHTML = `<p class="mute">…</p>`;
  digest = await call(`?view=digest&lang=${lang}`);
  const wa = "https://wa.me/?text=" + encodeURIComponent(digest.text);
  $("#out").innerHTML = `<div class="card">
    <div class="row"><strong>${esc(t("tab_digest"))}</strong><span class="pill ok">${esc(t("dg_fresh", { n: digest.fresh }))}</span></div>
    <pre class="dg" id="dgText">${esc(digest.text)}</pre>
    <div class="row l"><button class="go" id="dgCopy">${esc(t("dg_copy"))}</button><a class="btn" href="${esc(wa)}" target="_blank" rel="noopener">${esc(t("dg_wa"))}</a>
    <button id="dgPost" ${digest.telegram ? "" : "disabled"}>${esc(t("dg_post"))}</button><a class="btn" href="/digest" target="_blank" rel="noopener">/digest ↗</a></div>
    ${digest.posted ? `<p class="mute">${esc(t("dg_already", { t: new Date(digest.posted.posted_at).toLocaleTimeString() }))}</p>` : ""}
    <p class="note ${digest.telegram ? "" : "warn"}">${esc(digest.telegram ? t("dg_auto") : t("dg_tg_off"))}</p>
    <p class="note warn">${esc(t("dg_wa_note"))}</p></div>`;
}

/* ---------- old views ---------- */
async function loadOld() {
  const { items } = await call("?view=" + view);
  if (view === "proofs") $("#out").innerHTML = items.length ? items.map(p => `<div class="card"><div class="row"><strong>${esc(p.first_name)}, ${esc(p.country)}</strong><span class="mute">${new Date(p.created_at).toLocaleString()}</span></div>
    <div>${esc(p.programme)}${p.year ? " · " + esc(p.year) : ""}</div>${p.contact ? `<div class="mute">${esc(t("pf_contact"))}: ${esc(p.contact)}</div>` : ""}
    <div class="row">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t("pf_letter"))}</a>` : `<span class="mute">${esc(t("pf_nofile"))}</span>`}
    <span><button class="go" data-p="approve" data-id="${esc(p.id)}">${esc(t("q_approve"))}</button> <button class="no" data-p="reject" data-id="${esc(p.id)}">${esc(t("q_reject"))}</button></span></div>
    <div class="mute">${esc(t("pf_check"))}</div></div>`).join("") : `<p class="mute">${esc(t("pf_empty"))}</p>`;
  if (view === "radar") $("#out").innerHTML = items.length ? items.map(r => `<div class="card"><div class="row"><span class="v ${esc(r.verdict)}">${esc(String(r.verdict).toUpperCase())}</span><span class="mute">${new Date(r.created_at).toLocaleString()} · ${esc(r.source)}</span></div><div>${esc(r.snippet)}</div><div class="mute">${(r.flags || []).map(esc).join(" · ")}</div></div>`).join("") : `<p class="mute">${esc(t("rd_empty"))}</p>`;
  if (view === "captains") $("#out").innerHTML = items.length ? `<table><thead><tr><th>${esc(t("cp_code"))}</th><th>${esc(t("cp_name"))}</th><th>${esc(t("cp_group"))}</th><th>${esc(t("cp_visits"))}</th><th>${esc(t("cp_shares"))}</th></tr></thead><tbody>${items.map(c => `<tr><td>${esc(c.code)}</td><td>${esc(c.display_name)}</td><td>${esc(c.group_name)}</td><td class="r">${c.visits}</td><td class="r">${c.shares}</td></tr>`).join("")}</tbody></table>` : `<p class="mute">${esc(t("cp_empty"))}</p>`;
}

async function load() {
  try {
    if (view === "queue") await loadQueue(); else if (view === "digest") await loadDigest(); else await loadOld();
  } catch (e) { if (!$("#login").hidden) return; $("#out").innerHTML = `<p class="probs">${esc(String(e.message) === "Database not configured" ? t("ad_nodb") : t("err", { t: e.message }))}</p>`; }
}

/* ---------- events ---------- */
$("#lang").innerHTML = LANGS.map(l => `<option value="${l.code}">${esc(l.name)}${l.code === "en" ? "" : " (beta)"}</option>`).join("");
$("#lang").value = lang;
$("#lang").onchange = e => { lang = e.target.value; localStorage.setItem("u_admin_lang", lang); paintChrome(); if (!$("#tabs").hidden) load(); };
$("#login").onsubmit = async e => {
  e.preventDefault(); $("#loginBtn").disabled = true;
  try { const r = await call("", { action: "login", pin: $("#pin").value }); if (!r.ok) throw new Error(r.error || "Wrong PIN"); $("#pin").value = ""; showApp(); load(); }
  catch (err) { $("#loginErr").hidden = false; $("#loginErr").textContent = err.message === "Wrong PIN" ? t("ad_wrong") : err.message; }
  finally { $("#loginBtn").disabled = false; }
};
$("#logout").onclick = async () => { await call("", { action: "logout" }).catch(() => {}); showLogin(); };
$("#tabs").onclick = e => { const v = e.target.closest("button")?.dataset.v; if (!v) return; view = v; $$("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); load(); };

$("#out").addEventListener("change", e => {
  if (e.target.id === "all") { $$(".pick").forEach(c => c.checked = e.target.checked); updateBulk(); }
  if (e.target.classList.contains("pick")) updateBulk();
});
$("#out").addEventListener("click", async e => {
  const s = e.target.closest("[data-s]"); if (s) { status = s.dataset.s; return load(); }
  const btn = e.target.closest("button, a[data-a]"); if (!btn) return;
  const el = btn.closest("[data-id]"), id = el?.dataset.id;
  try {
    if (btn.dataset.a === "open") { markOpened(id); const p = el.querySelector("[data-opened]"); p.textContent = t("q_opened"); p.className = "pill ok"; return; }
    if (btn.id === "bulk") {
      const ids = $$(".pick:checked").map(c => c.closest("[data-id]").dataset.id); btn.disabled = true;
      const r = await call("", { action: "listing.approve", ids });
      const blocked = Object.keys(r.blocked || {}).length;
      toast(t("q_approved_n", { n: r.approved.length }) + (blocked ? " · " + t("q_blocked_n", { n: blocked }) : "")); return load();
    }
    if (btn.id === "expire") { btn.disabled = true; const r = await call("", { action: "listing.expire" }); toast(t("q_expired_n", { n: r.expired })); return load(); }
    if (btn.id === "fetch") {
      btn.disabled = true; btn.textContent = t("q_fetching");
      const { report } = await call("", { action: "drafts.generate" });
      toast(t("q_report", { c: report.created, d: report.dupes, e: report.errors.length }));
      await load(); $("#report").textContent = t("q_report", { c: report.created, d: report.dupes, e: report.errors.length }) + (report.errors.length ? " — " + report.errors.join("; ") : ""); return;
    }
    if (btn.id === "dgCopy") { await navigator.clipboard.writeText(digest.text).then(() => toast(t("dg_copied")), () => { const r = document.createRange(); r.selectNodeContents($("#dgText")); getSelection().removeAllRanges(); getSelection().addRange(r); }); return; }
    if (btn.id === "dgPost") { btn.disabled = true; await call("", { action: "digest.post", lang }); toast(t("dg_posted")); return load(); }
    if (btn.dataset.p) { btn.disabled = true; await call("", { action: btn.dataset.p, id: btn.dataset.id }); return load(); }
    if (!id) return;
    const a = btn.dataset.a; btn.disabled = true;
    if (a === "check") {
      const out = el.querySelector("[data-check]"); out.textContent = t("q_checking");
      const r = await call("", { action: "listing.check", id });
      out.textContent = r.ok ? t("q_link_ok", { n: r.status }) : t("q_link_bad", { n: r.status || "—" }); out.style.color = r.ok ? "var(--mint)" : "var(--coral)";
      btn.disabled = false; return;
    }
    if (a === "save") {
      const r = await call("", { action: "listing.update", id, fields: fieldsOf(el) });
      const pr = el.querySelector("[data-probs]"); pr.hidden = !r.item.problems.length; pr.textContent = t("q_cant") + " " + r.item.problems.map(p => t("pr_" + p)).join(" · ");
      toast(t("q_saved")); btn.disabled = false; return;
    }
    if (a === "approve") {
      const r = await call("", { action: "listing.approve", ids: [id], fields: fieldsOf(el) });
      if (r.blocked?.[id]) { const pr = el.querySelector("[data-probs]"); pr.hidden = false; pr.textContent = t("q_cant") + " " + r.blocked[id].map(p => t("pr_" + p)).join(" · "); btn.disabled = false; return; }
      toast(t("q_approved_n", { n: 1 })); el.remove(); counts.draft--; return;
    }
    if (a === "reject" || a === "unpublish") { await call("", { action: a === "reject" ? "listing.reject" : "listing.unpublish", ids: [id] }); el.remove(); return; }
  } catch (err) { btn.disabled = false; toast(t("err", { t: err.message })); }
});

paintChrome();
call("?view=session").then(r => { if (r.ok) { showApp(); load(); } else showLogin(); }).catch(() => showLogin());
}
</script>
