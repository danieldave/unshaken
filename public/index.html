<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Verified ways to earn, learn and go abroad. Free, no sign-up, with a scam checker.">
<title>Unshaken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, sure, protective — a friend who checks before you leap
   IDEA: a morning status drop, then a deadline board pinned by countdowns
   PICTURE: the full-screen story card with a live clock
   COLOUR and TYPE: night green-black; mint = safe/money, gold = deadlines, coral = danger; Space Grotesk + Inter
   LAYOUT: one phone-width column, tabs scroll sideways */
:root{color-scheme:dark;--bg:#07110D;--card:#0F1D17;--card2:#14261E;--line:rgba(243,247,244,.13);--ink:#F3F7F4;--soft:#CFE0D6;--mute:#A9BDB2;--mint:#2BD38A;--gold:#F5B83D;--coral:#FF8A6B}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,7vw,32px)}
a{color:var(--mint)}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:700 21px "Space Grotesk"}
.logo i{width:36px;height:36px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.tools{display:flex;gap:8px;align-items:center}
.tools select,.pill{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px}
.pill[aria-pressed=true]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.betatag{color:var(--gold)}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--card);padding:4px;border-radius:14px;position:sticky;top:6px;z-index:5;border:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;min-height:44px;padding:0 14px;display:grid;place-items:center;border-radius:11px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
.sub{color:var(--mute);font-size:14px}
.lead{font:600 22px/1.25 "Space Grotesk"}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:700;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);text-align:center;gap:6px}
.btn.go{background:var(--mint);color:var(--bg);border:0}.btn.gold{background:var(--gold);color:var(--bg);border:0}
.btn.sm{min-height:44px;font-size:15px}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{flex:1 1 130px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.panel{margin-top:16px;border-radius:20px;padding:18px}
.card{margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;color:var(--mint);background:rgba(43,211,138,.12);padding:4px 9px;border-radius:999px}
.due{font-size:12px;font-weight:700;color:var(--bg);background:var(--gold);padding:4px 9px;border-radius:999px;white-space:nowrap}
.due.open{background:var(--mint)}.due.shut{background:#5b6b63;color:var(--ink)}
.fit{font-size:13px;font-weight:600}.fit.yes{color:var(--mint)}.fit.maybe{color:var(--gold)}.fit.no{color:var(--mute)}
.card h3{font-size:19px}
.card p{margin:0;font-size:15px;color:var(--soft)}
.note{font-size:13px;color:var(--gold)}
details summary{cursor:pointer;font-weight:600;min-height:32px}
details ol,.steps{margin:8px 0 0;padding-left:20px;color:var(--soft);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chips button{min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.empty{color:var(--mute);text-align:center;padding:28px 0}
label{font-weight:600;font-size:15px}
.field{display:grid;gap:6px}
input[type=text],input[type=number],select.full,textarea{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(243,247,244,.05);padding:0 14px;font-size:16px}
textarea{min-height:150px;padding:14px;resize:vertical}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{font-weight:500;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opts input{accent-color:var(--mint)}
.opts label:has(input:checked){border-color:var(--mint);background:rgba(43,211,138,.1)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--mint);flex:none;margin-top:2px}
/* story */
.story{position:relative;margin-top:14px;border-radius:24px;overflow:hidden;min-height:600px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.glow{position:absolute;inset:0;pointer-events:none}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:14px 16px 0;position:relative;z-index:2}
.bars span{height:3px;border-radius:3px;background:rgba(243,247,244,.22);overflow:hidden}
.bars b{display:block;height:3px;background:var(--ink);width:0}
.sbody{position:relative;z-index:2;padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px;flex:1;pointer-events:none}
.sbody a,.sbody button{pointer-events:auto}
.kick{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--mint)}
.big{font:700 clamp(52px,16vw,72px)/.95 "Space Grotesk";letter-spacing:-2px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:rgba(243,247,244,.06);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile strong{display:block;font:700 22px "Space Grotesk";white-space:nowrap}
.clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.clock div{text-align:center;background:rgba(245,184,61,.1);border:1px solid rgba(245,184,61,.35);border-radius:14px;padding:8px 0}
.clock b{display:block;font:700 28px "Space Grotesk";color:var(--gold);font-variant-numeric:tabular-nums}
.clock small{font-size:11px;color:var(--mute)}
.cta{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}.cta .btn{flex:1 1 140px}
.tap{position:absolute;top:56px;bottom:96px;z-index:1;background:none;border:0}
.tap.l{left:0;width:35%}.tap.r{right:0;width:65%}
.warn{background:rgba(255,138,107,.1);border:1px solid rgba(255,138,107,.4);border-radius:16px;padding:14px;display:grid;gap:6px}
.ring{font:700 64px/1 "Space Grotesk";color:var(--mint)}
/* verdicts, meters */
.verdict{border-radius:18px;padding:16px;display:grid;gap:8px}
.v-green{background:rgba(43,211,138,.12);border:1px solid var(--mint)}
.v-orange{background:rgba(245,184,61,.12);border:1px solid var(--gold)}
.v-red{background:rgba(255,138,107,.12);border:1px solid var(--coral)}
.verdict ul{margin:0;padding-left:20px}
.meter{height:8px;border-radius:8px;background:rgba(243,247,244,.12);overflow:hidden}
.meter b{display:block;height:8px;background:var(--mint);border-radius:8px}
.score{display:grid;gap:4px}
.score .row span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.rw{border-left:3px solid var(--line);padding-left:12px;display:grid;gap:4px;font-size:15px}
.rw s{color:var(--mute)}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task input{width:22px;height:22px;accent-color:var(--mint);flex:none;margin-top:3px}
.task .when{font-size:12px;color:var(--mute);white-space:nowrap}
.task.today{background:rgba(245,184,61,.08);margin:0 -16px;padding:10px 16px}
.task.done span{text-decoration:line-through;color:var(--mute)}
.winner{display:flex;gap:12px;align-items:center}
.winner i{width:44px;height:44px;border-radius:50%;background:var(--mint);color:var(--bg);display:grid;place-items:center;font:700 18px "Space Grotesk";font-style:normal;flex:none}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat div{background:var(--card2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font:700 26px "Space Grotesk"}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 28px;display:grid;gap:16px;border:1px solid var(--line)}
.foot{color:var(--mute);font-size:13px;margin-top:26px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><i><svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#07110D" stroke-width="2.5"/><line x1="5" y1="17" x2="25" y2="17" stroke="#0B7A4B" stroke-width="3" stroke-linecap="round"/><circle cx="15" cy="10.5" r="3" fill="#F5B83D"/></svg></i>Unshaken</div>
  <div class="tools">
    <label for="lang" class="sub" style="position:absolute;width:1px;height:1px;overflow:hidden">Language</label>
    <select id="lang" aria-label="Language"></select>
    <button class="pill" id="listen" aria-pressed="false" data-t="listen">Listen</button>
  </div>
</header>
<div class="meta"><span data-t="nosignup">No sign-up · No subscription</span><span><span id="betatag" class="betatag" hidden data-t="beta">Beta translation</span> <span id="reset"></span></span></div>
<nav aria-label="Sections" id="nav"></nav>
<main id="main"></main>
<p class="foot" data-t="foot"></p>
</div>
<div id="modal" class="modal" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
