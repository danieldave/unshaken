<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unshaken Daily</title>
<meta name="description" content="Today's exchange rates and newly verified scholarships, free courses and earning doors. Free, no sign-up.">
<meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta property="og:title" content="Unshaken Daily: rates and today's open doors">
<meta property="og:description" content="Free. No sign-up. Every link is an official page.">
<meta property="og:image" content="/icons/og.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ds/ds.css">
<style>
/* Editorial digest — page layer on ODS tokens */
:root{--mint:#12804e;--gold:#a85a00}
@media (prefers-color-scheme:dark){:root{--mint:#3ecf8e;--gold:var(--accent)}}

*{min-width:0}
[hidden]{display:none!important}
button,select,.btn{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header{display:flex;align-items:center;gap:10px;height:56px;max-width:680px;margin:0 auto;padding:0 16px}
.logo{font-weight:650;font-size:16px;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}
.logo img{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-2)}
select,.kb{height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);color:var(--text);padding:0 10px;font-size:13.5px;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 64px;overflow-x:clip}
.hero{padding:44px 0 22px}
.kick{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(32px,8vw,48px);line-height:1.04;letter-spacing:-.035em;font-weight:650;margin:10px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:12px 0 0;font-size:16px;max-width:520px}
.pill{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;height:26px;font-size:13px;font-weight:600;letter-spacing:0;color:var(--mint);background:color-mix(in srgb,var(--mint) 12%,transparent);border-radius:99px;padding:0 10px;margin-left:8px;-webkit-text-fill-color:var(--mint)}
.beta{color:var(--gold);font-size:13px;margin:10px 0 0}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:8px 22px 18px;box-shadow:var(--shadow-2);font-size:15.5px;line-height:1.65}
.paper p{margin:0 0 10px;white-space:pre-wrap;word-break:break-word;color:var(--text-2)}
.paper p:first-child{margin-top:14px}
.paper p strong{color:var(--text);font-weight:600}
.paper p.h{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.paper p.h strong{color:var(--muted)}
.paper p.h:first-child{border-top:0;padding-top:0}
.paper p.it{padding:2px 0 2px 14px;border-left:2px solid var(--line-2);font-variant-numeric:tabular-nums}
.paper a{color:var(--accent);word-break:break-all}
.paper a:hover{text-decoration:underline}
.paper .note{color:var(--muted);font-size:13px}
.skel{display:grid;gap:10px;padding:14px 0 4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{min-height:44px;border-radius:var(--r-2);border:1px solid var(--line-2);background:var(--raised);font-weight:550;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text);cursor:pointer;padding:0 12px;text-align:center;transition:border-color var(--t-1),background var(--t-1),transform var(--t-1)}
.btn:hover{border-color:color-mix(in srgb,var(--text) 22%,transparent)}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:transparent;grid-column:1/-1}
.btn.go:hover{background:var(--accent-2)}
.foot{color:var(--muted);font-size:12.5px;margin-top:28px;text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:550;box-shadow:var(--shadow-2);animation:o-in var(--t-2) var(--ease) both}
@media (hover:none),(max-width:600px){.o-kbd{display:none}}
.kb{display:inline-flex;align-items:center;gap:6px}
.paper p.ti{color:var(--text);font-weight:600;margin:14px 0 6px}
@media print{.topbar,.actions,.toast{display:none!important}.paper{box-shadow:none;border-color:#ccc}}
</style>
</head>
<body class="ods">
<div class="topbar"><header><a class="logo" href="/"><img src="/icons/icon-192.png" alt="">Unshaken</a><span class="o-sp"></span><button class="kb" id="cmdk" type="button" aria-label="Command menu (Ctrl+K)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><span class="o-kbd" id="kk">Ctrl K</span></button><select id="lang" aria-label="Language"></select></header></div>
<div class="wrap">
  <section class="hero o-glow">
  <div class="kick o-num" id="date"></div>
  <h1 id="title" class="o-grad">Today's digest</h1>
  <p class="sub" id="sub"></p>
  <p class="beta" id="beta" hidden></p>
  </section>
  <div class="paper" id="paper" aria-live="polite"><p class="note" id="status">Loading…</p></div>
  <div class="actions" id="actions" hidden>
    <button class="btn go" id="copy"></button>
    <a class="btn" id="wa" target="_blank" rel="noopener"></a>
    <a class="btn" id="tg" target="_blank" rel="noopener"></a>
    <a class="btn" href="/" id="back" style="grid-column:1/-1"></a>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script src="/ds/cmdk.js"></script>
<script src="/i18n-ops.js"></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const OPS = window.UNSHAKEN_OPS, LANGS = window.UNSHAKEN_OPS_LANGS;
const q = new URLSearchParams(location.search);
let lang = q.get("lang") || localStorage.getItem("u_lang_ops") || (localStorage.getItem("u_lang") || "").replace(/"/g, "") || "en";
if (!OPS[lang]) lang = "en";
const t = (k, v = {}) => String(OPS[lang]?.[k] ?? OPS.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
let text = "";

// *bold* → <strong>, links clickable, one <p> per block
function render(raw) {
  const inline = s => esc(s).replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>").replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g, "$1<em>$2</em>").replace(/https:\/\/[^\s<)]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return raw.split("\n").map(l => {
    if (!l.trim()) return "";
    const cls = /^\d+\.\s\*/.test(l) ? "ti" : /^\S+\s\*[^*]+\*(\s\(|$)/.test(l) ? "h" : /^\s{3}/.test(l) ? "it" : /^_.*_$/.test(l) ? "note" : "";
    return `<p class="${cls}">${inline(l.trim())}</p>`;
  }).join("");
}
function paint() {
  document.documentElement.lang = lang;
  $("#title").textContent = t("dg_title"); $("#sub").textContent = t("dg_sub");
  $("#beta").hidden = lang === "en"; $("#beta").textContent = t("beta");
  $("#copy").textContent = t("dg_copy"); $("#wa").textContent = t("dg_wa"); $("#tg").textContent = t("dg_tg"); $("#back").textContent = t("dg_back");
  $("#foot").textContent = t("dg_free");
  $("#date").textContent = new Date().toLocaleDateString(lang === "en" || lang === "pcm" ? "en-GB" : lang, { weekday: "long", day: "numeric", month: "long" });
}
async function load() {
  paint();
  $("#actions").hidden = true; $("#paper").innerHTML = `<div class="skel" aria-busy="true"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden">${esc(t("dg_loading"))}</span><div class="o-skel" style="height:14px;width:40%"></div><div class="o-skel" style="height:44px"></div><div class="o-skel" style="height:14px;width:30%;margin-top:10px"></div><div class="o-skel" style="height:60px"></div><div class="o-skel" style="height:60px"></div></div>`;
  try {
    const r = await fetch(`/api/listings?view=digest&lang=${encodeURIComponent(lang)}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(); text = d.text || "";
    if (!text) throw new Error("empty");
    $("#paper").innerHTML = render(text);
    if (d.fresh) $("#title").insertAdjacentHTML("beforeend", ` <span class="pill">${esc(t("dg_fresh", { n: d.fresh }))}</span>`);
    $("#wa").href = "https://wa.me/?text=" + encodeURIComponent(text);
    $("#tg").href = "https://t.me/share/url?url=" + encodeURIComponent(location.origin + "/digest") + "&text=" + encodeURIComponent(text.slice(0, 3000));
    $("#actions").hidden = false; palette();
  } catch { $("#paper").innerHTML = `<p class="note">${esc(t("dg_error"))}</p>`; }
}
$("#lang").innerHTML = LANGS.map(l => `<option value="${l.code}">${esc(l.name)}${l.code === "en" ? "" : " (beta)"}</option>`).join("");
$("#lang").value = lang;
$("#lang").onchange = e => { lang = e.target.value; localStorage.setItem("u_lang_ops", lang); history.replaceState(null, "", "?lang=" + lang); load(); };
$("#copy").onclick = async () => {
  try { await navigator.clipboard.writeText(text); } catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); } catch {} ta.remove(); }
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t("dg_copied"); document.body.append(d); setTimeout(() => d.remove(), 2000);
};
function palette() {
  if (!window.ODS?.cmdk) return;
  const L = [];
  if (text) L.push({ group: "Share", icon: "⧉", title: t("dg_copy"), run: () => $("#copy").click() },
    { group: "Share", icon: "↗", title: t("dg_wa"), href: $("#wa").href }, { group: "Share", icon: "↗", title: t("dg_tg"), href: $("#tg").href });
  L.push({ group: "Go to", icon: "→", title: t("dg_back"), href: "/" });
  LANGS.forEach(l => L.push({ group: "Language", icon: "A", title: l.name, hint: l.code === lang ? "✓" : "", run: () => { $("#lang").value = l.code; $("#lang").onchange({ target: $("#lang") }); } }));
  window.ODS.cmdk(L);
}
if (/Mac|iPhone|iPad/.test(navigator.platform || "")) $("#kk").textContent = "⌘K";
$("#cmdk").onclick = () => window.ODS?.openCmdk?.();
palette();
load();
}
</script>
</body>
</html>
