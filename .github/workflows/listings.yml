name: Check listings
on:
  push:
    paths: ["public/data/**"]
  schedule:
    - cron: "15 4 * * *"   # every day, 5:15am Lagos
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check-listings.mjs
